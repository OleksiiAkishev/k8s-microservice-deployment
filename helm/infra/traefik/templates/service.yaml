apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.ingress.name }}
  namespace: {{ .Values.ingress.namespace }}
spec:
  type: NodePort
  selector:
    app: {{ .Values.ingress.name }}
  ports:
    - protocol: {{ .Values.service.protocol }}
      port: {{ .Values.service.port }}
      nodePort: {{ .Values.service.nodePort }}