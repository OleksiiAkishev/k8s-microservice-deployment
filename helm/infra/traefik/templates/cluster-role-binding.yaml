apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.ingress.name }}-binding
subjects:
  - kind: ServiceAccount
    name: {{ .Values.ingress.name }}-controller
    namespace: {{ .Values.ingress.namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Values.ingress.name }}-role
  apiGroup: rbac.authorization.k8s.io