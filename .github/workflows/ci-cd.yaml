name: AKS CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile check (syntax)
        run: python -m compileall .
      - name: Lint check
        run: ruff check .
      - name: Run tests
        run: pytest
        env:
          PYTHONPATH: .
  docker-build:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set image tag
        run: |
          IMAGE_TAG="ghcr.io/${GITHUB_REPOSITORY,,}/k8s-python-api:latest"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_TAG }}
  ephemeral-cluster-deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set environment variables
        run: |
          echo "CLUSTER_NAME=${GITHUB_ACTOR,,}-kind-cluster" >> $GITHUB_ENV
      - name: Create KIND cluster
        uses: helm/kind-action@v1
        with:
          cluster-name: ${{ env.CLUSTER_NAME }}
      - name: Verify cluster
        run: |
          kubectl cluster-info --context ${{ env.CLUSTER_NAME }}-kind-cluster
      - name: Create GHCR secret
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=https://ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GHCR_TOKEN }} \
            --docker-email=${{ github.actor }}@users.noreply.github.com \
            --context ${{ env.CLUSTER_NAME }}-kind-cluster
      - name: Install Helm and Deploy
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4.sh | bash
          helm upgrade --install k8s-python-api ./k8s-python-api-helm \
            --set image.repository=${{ env.IMAGE_TAG }} \
            --set image.tag=latest \
            --kube-context ${{ env.CLUSTER_NAME }}-kind-cluster \
            --wait --timeout 120s
      - name: Verify deployment
        run: |
          kubectl rollout status deployment/k8s-python-api --context ${{ env.CLUSTER_NAME }}-kind-cluster
          kubectl get pods --context ${{ env.CLUSTER_NAME }}-kind-cluster

  helm upgrade --install k8s-python-api ./k8s-python-api-helm \
  --namespace $(yq e '.namespace' values.yaml) \
  --create-namespace

  helm upgrade --install my-app ./my-chart \
  --set username=myuser \
  --set password=$(echo -n $GITHUB_TOKEN)